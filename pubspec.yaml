name: iai_horizon
description: Plateforme mobile intelligente IAI Horizon (IAI-Cameroun)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.6.2

  # État
  provider: ^6.1.2

  # Réseau (appels vers le backend Node.js)
  http: ^1.2.2

  # Stockage sécurisé du token JWT
  flutter_secure_storage: ^9.2.2

  # Upload de fichiers (CV) vers l'URL signée Supabase renvoyée par le backend
  file_picker: ^8.0.6

  # Sélection d'image depuis la galerie (photo de profil)
  image_picker: ^1.1.2

  # Ouverture d'URLs (pour les fichiers uploadés)
  url_launcher: ^6.3.0

  # Notifications push (Firebase Cloud Messaging)
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/image/
