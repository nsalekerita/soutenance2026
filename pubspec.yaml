name: iai_horizon
description: Plateforme mobile intelligente IAI Horizon (IAI-Cameroun)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.6.2

  # État
  provider: ^6.1.2

  # Réseau (appels vers le backend Node.js)
  http: ^1.2.2

  # Auth Google (à connecter au endpoint /api/auth/google du backend)
  google_sign_in: ^7.2.0

  # Stockage sécurisé du token JWT
  flutter_secure_storage: ^9.2.2

  # Upload de fichiers (CV) vers l'URL signée Supabase renvoyée par le backend
  file_picker: ^8.0.6

  # Sélection d'image depuis la galerie (photo de profil)
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/image/